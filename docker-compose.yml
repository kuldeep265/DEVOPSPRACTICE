version: '3.9'

services:
  maven:
    build: .
    container_name: mavencont11
    ports:
      - "3000:3000"

  mysql:
    image: mysql:8
    container_name: mysqlcont11
    environment:
      - MYSQL_ROOT_PASSWORD=pass123
    ports:
      - "8082:3306"
    volumes:
      - appdata11:/var/lib/mysql

volumes:
  appdata11: